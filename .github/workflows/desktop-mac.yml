# Builds the macOS desktop app (Intel + Apple Silicon) and attaches it to a GitHub release.
# Run it from Actions > "Desktop app (macOS)" > Run workflow, or it runs when a release is published.
name: Desktop app (macOS)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the files to
        required: true
        default: v1.0.0
  release:
    types: [published]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    env:
      TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web app and macOS app bundles
        run: npm run dist:mac

      - name: Sign ad-hoc and package as .dmg and .zip
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          for pair in "mac:Intel" "mac-arm64:AppleSilicon"; do
            dir="dist-desktop/${pair%%:*}"; arch="${pair##*:}"
            app="$dir/NCA Ojo Attendance.app"
            # Ad-hoc signature so the app can open on Apple Silicon (not notarized)
            codesign --force --deep --sign - "$app"
            hdiutil create -volname "NCA Ojo Attendance" -srcfolder "$app" -ov -format UDZO "release/NCA-Ojo-Attendance-$VERSION-mac-$arch.dmg"
            ditto -c -k --keepParent "$app" "release/NCA-Ojo-Attendance-$VERSION-mac-$arch.zip"
          done
          ls -la release

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/* --clobber
